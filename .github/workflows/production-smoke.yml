name: Production smoke

on:
  workflow_dispatch:
    inputs:
      production_origin:
        description: Canonical production origin
        required: true
        default: https://tools.securetools.app
        type: string
      immutable_origin:
        description: Immutable deployment origin to compare
        required: true
        type: string
      source_commit:
        description: Full source SHA of the deployment being verified
        required: true
        type: string
  # Bootstrap this new workflow before its explicitly authorized merge.
  # Ordinary development PRs do not run the production browser gate.
  pull_request:
    branches: [main]
    paths: [.github/workflows/production-smoke.yml, 'tests/production/**']

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/production-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_ORIGIN: ${{ inputs.production_origin || 'https://tools.securetools.app' }}
      IMMUTABLE_ORIGIN: ${{ inputs.immutable_origin || 'https://b9802e7e.secure-tools-web-bridge.pages.dev' }}
      EXPECTED_PRODUCTION_SHA: ${{ inputs.source_commit || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Read canonical version and verification code from the expected deployment.
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require deployment source provenance
        run: |
          node scripts/verify-build-provenance.mjs "$PRODUCTION_ORIGIN" "$EXPECTED_PRODUCTION_SHA"
          node scripts/verify-build-provenance.mjs "$IMMUTABLE_ORIGIN" "$EXPECTED_PRODUCTION_SHA"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - name: Publish technical result
        if: always()
        run: cat .ts-build/production-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain failure diagnostics (synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-smoke-diagnostics
          path: .ts-build/production-smoke
          retention-days: 7
