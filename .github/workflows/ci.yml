name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2

permissions:
  contents: read

jobs:
  validate:
    name: Validate static tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

      - name: Install pinned OCR build inputs
        run: npm ci --ignore-scripts

      - name: Verify prepared production OCR assets
        run: npm run build

      - name: Run static tool validation
        run: npm test

      - name: Run real local OCR smoke test
        run: node tests/ocr-smoke.test.mjs
