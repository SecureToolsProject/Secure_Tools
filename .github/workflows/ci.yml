name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v2
      - v2.3

permissions:
  contents: read

jobs:
  validate:
    name: Validate static tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enforce pull request branch policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-branch-policy.mjs "$BASE_REF" "$HEAD_REF"

      - name: Enforce commit and pull request title conventions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_CONVENTION_GRANDFATHER: edb0ade331c54f380ae33abe7816c5a92f3a590a
        run: |
          node scripts/validate-commit-message.mjs --range "$BASE_SHA" "$HEAD_SHA" --grandfather-through "$COMMIT_CONVENTION_GRANDFATHER"
          node scripts/validate-commit-message.mjs --title "$PR_TITLE"

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

      - name: Install pinned OCR build inputs
        run: npm ci --ignore-scripts

      - name: Type-check migrated browser modules
        run: npm run typecheck

      - name: Verify prepared production OCR assets
        run: npm run build

      - name: Validate generated artifact and source provenance
        run: node scripts/validate-build.mjs

      - name: Run static tool validation
        run: npm test

      - name: Run real local OCR smoke test
        run: node tests/ocr-smoke.test.mjs

      - name: Install pinned browser for artifact security verification
        run: npx playwright install --with-deps chromium

      - name: Verify HTTP headers, browser OCR and downloads on built artifact
        run: node tests/production/local-smoke.mjs

      - name: Retain artifact browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-browser-diagnostics
          path: .ts-build/production-smoke
          retention-days: 7
