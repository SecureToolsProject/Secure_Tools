version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2.4"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      prefix: "chore/dependabot"
    commit-message:
      # Trailing space prevents Dependabot from inserting a colon after [Config].
      prefix: "🔧[Config] "
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "v2.4"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      prefix: "chore/dependabot"
    commit-message:
      prefix: "🔧[Config] "
